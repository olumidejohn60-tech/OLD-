:root{--ink:#f2f6ee;--gold:#ffc83d;--panel:rgba(8,20,32,.78);--line:rgba(255,255,255,.35);

@media (orientation:portrait){#rot{display:flex}}
#over{overflow-y:auto}

.chip{font-size:15px;padding:5px 12px;border-radius:999px;background:transparent;color:var(--ink);border:2px solid var(--line)}
.chip.on{background:var(--gold);color:#10241a;border-color:var(--gold)}

#opts{display:flex;flex-direction:column;gap:4px;align-items:center;margin:2px 0}.og{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}.og i{font-style:normal;font-size:13px;opacity:.75;text-transform:uppercase;letter-spacing:.08em;min-width:74px;text-align:right}

function act(a,v){
  switch(a){
    case 'go':if(v==='teams')UI.tp='user';show(v,1);break;
    case 'back':goBack();break;
    case 'pick':UI.tp=v;show('teams',1);break;
    case 'team':pickTeam(+v);UIr();break;
    case 'opp':if(+v===sel)break;OPPFIX=+v;if(OPPFIX>=0){opp=OPPFIX;applyTeams()}UIr();break;
    case 'mode':setMode(+v);break;
    case 'len':G.len=+v;G.clock=G.len;hud();UIr();break;
    case 'form':FA=v;applyTeams();kickoff(0);UIr();break;
    case 'gfx':setQuality(+v);UIr();break;
    case 'snd':setSound(v==='1');break;
    case 'com':setComm(v==='1');break;
    case 'auto':G.auto=v==='1';savePrefs();UIr();break;
    case 'hud':setHud(+v);break;
    case 'setcam':setCam(+v,true);break;
    case 'squad':openSquad();break;
    case 'kick':start();break;
    case 'rematch':start(true);break;
    case 'resume':resumeGame();break;
    case 'subs':openMatchSquad('squad',true);break;
    case 'tact':openMatchSquad('tac',true);break;
    case 'restart':case 'quit':UI.cf=a;UIr();break;
    case 'no':UI.cf=null;UIr();break;
    case 'yes':if(UI.cf==='quit')toMenu();else{UI.cf=null;start(true)}break;
    case 'fullmenu':toMenu();break;
    case 'hcont':hideUI();G.paused=false;try{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume()}catch(e){}kickoff(1);sfxWhistle('short');break;
    case 'skiprp':endReplay();break;
    case 'gs':GSP=+v;savePrefs();UIr();break;case 'df':DIFF=+v;savePrefs();UIr();break;case 'hap':HAP=+v;vib(15);savePrefs();UIr();break;case 'rpy':RPY=+v;savePrefs();UIr();break;
    case 'lf':LEFT=+v;applyPrefs();savePrefs();UIr();break;case 'fc':FC=+v;savePrefs();UIr();break;
  }
}

  if(b>=0)G.ctl=b;
}

}
